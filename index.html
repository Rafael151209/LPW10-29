
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro da Empresa</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <h1>Cadastro da Empresa</h1>

    <form id="formEmpresa">
        <label for="nome">Nome da empresa:</label><br>
        <input type="text" id="nome" required><br><br>

        <label for="endereco">Endereço:</label><br>
        <input type="text" id="endereco" required><br><br>

        <label for="telefone">Telefone de contato:</label><br>
        <input type="tel" id="telefone" required><br><br>

        <label for="cnpj">CNPJ:</label><br>
        <input type="text" id="cnpj" maxlength="18" required><br><br>

        <label for="ie">Inscrição Estadual (IE):</label><br>
        <input type="text" id="ie"><br><br>

        <label for="responsavel">Pessoa física responsável:</label><br>
        <input type="text" id="responsavel" required><br><br>

        <button type="submit">Cadastrar</button>
        <button type="reset">Limpar</button>
    </form>

    <p id="mensagem"></p>

    <script src="script.js"></script>
</body>
</html>
